listener 1883
# Không cho kết nối ẩn danh. Tài khoản được tạo khi container khởi động (docker/mosquitto-entrypoint.sh)
# từ biến môi trường trong .env, nên không có mật khẩu nào nằm trong repository.
allow_anonymous false
password_file /mosquitto/passwd
# Quyền theo từng tài khoản (mặc định từ chối mọi topic không được liệt kê)
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
