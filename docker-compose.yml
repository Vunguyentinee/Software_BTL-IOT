# Lần đầu: sinh .env có mật khẩu ngẫu nhiên:  powershell -ExecutionPolicy Bypass -File docker\make-env.ps1
#                                            (Linux/macOS: sh docker/make-env.sh)
# Chạy cả hệ thống:  docker compose up -d --build
# Kèm ESP32 giả lập:  docker compose --profile sim up -d --build
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Chưa có .env - chạy docker/make-env.ps1}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?Chưa có .env - chạy docker/make-env.ps1}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD:?Chưa có .env - chạy docker/make-env.ps1}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto.acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto-entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthome}
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
    ports:
      # Chỉ mở cho chính máy chạy Docker (DBeaver/psql trên máy này); máy khác trong mạng không vào được.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      BTL_MQTT_HOST: mosquitto
      BTL_MQTT_PORT: "1883"
      BTL_MQTT_USERNAME: backend
      BTL_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Chưa có .env - chạy docker/make-env.ps1}
      BTL_DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD:-smarthome}@db:5432/${POSTGRES_DB:-smarthome}
      BTL_USERS: ${BTL_USERS:?Chưa có .env - chạy docker/make-env.ps1}
      BTL_JWT_SECRET: ${BTL_JWT_SECRET:?Chưa có .env - chạy docker/make-env.ps1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Không truyền mật khẩu nào vào web: người dùng tự đăng nhập (tài khoản khai báo ở BTL_USERS của backend)
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

  simulator:
    profiles: ["sim"]
    build: ./backend
    restart: unless-stopped
    environment:
      BTL_MQTT_USERNAME: simulator
      BTL_MQTT_PASSWORD: ${MQTT_SIM_PASSWORD:?Chưa có .env - chạy docker/make-env.ps1}
      BTL_SIM_CHECK_EXPIRY: ${SIM_CHECK_EXPIRY:-0}   # 1 = mô phỏng firmware có đồng hồ (từ chối lệnh quá hạn)
    command: ["python", "-m", "simulator.fake_esp32", "--host", "mosquitto"]
    depends_on:
      - mosquitto
      - backend

volumes:
  pgdata:
  mosquitto-data:
